<!DOCTYPE html>
<!--
  media-load-probe glide fixture. A tall column of painted images under a
  smooth-scroll layer: a wheel gesture is intercepted and the page eases
  toward its target (about 1.5 s of tail) instead of jumping. `?smooth=0`
  serves the same page with native scrolling and no glide.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>media-load-probe glide fixture</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  img { display: block; width: 300px; height: 300px; margin: 0 0 20px 20px; }
</style>
</head>
<body>
<script>
  const smooth = new URLSearchParams(location.search).get("smooth") !== "0";
  const colors = ["#d33", "#3a3", "#33d", "#da3", "#3ad", "#a3d", "#555", "#a55"];
  for (let i = 0; i < 40; i++) {
    const c = colors[i % colors.length];
    const img = new Image();
    img.src = "data:image/svg+xml," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="${c}"/><rect x="40" y="40" width="120" height="120" fill="#fff"/><rect x="150" y="150" width="100" height="100" fill="#000"/></svg>`);
    img.width = 300; img.height = 300;
    document.body.appendChild(img);
  }
  if (smooth) {
    let target = 0;
    let running = false;
    const max = () => document.documentElement.scrollHeight - innerHeight;
    const tick = () => {
      const y = scrollY;
      const next = y + (target - y) * 0.04;
      window.scrollTo(0, Math.abs(target - next) < 0.5 ? target : next);
      if (Math.abs(target - scrollY) >= 0.5) requestAnimationFrame(tick); else running = false;
    };
    addEventListener("wheel", (e) => {
      e.preventDefault();
      target = Math.max(0, Math.min(max(), target + e.deltaY));
      if (!running) { running = true; requestAnimationFrame(tick); }
    }, { passive: false });
  }
</script>
</body>
</html>
