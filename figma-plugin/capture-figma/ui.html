<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Capture Figma</title>
  <style>
    body {
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
      height: 100vh;
    }
    button {
      font-family: inherit;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    #export-btn {
      background: #18a0fb;
      color: #fff;
      font-weight: 600;
    }
    #export-btn:disabled {
      background: #a6d8fd;
      cursor: default;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #status {
      color: #666;
      min-height: 14px;
    }
    #status.error {
      color: #c0392b;
    }
    textarea {
      flex: 1;
      width: 100%;
      box-sizing: border-box;
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 11px;
      resize: none;
      border: 1px solid #e6e6e6;
      border-radius: 6px;
      padding: 8px;
    }
    #copy-btn, #download-link {
      background: #f0f0f0;
      color: #333;
    }
    #download-link {
      display: inline-block;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      opacity: 0.4;
      pointer-events: none;
    }
    #download-link.enabled {
      opacity: 1;
      pointer-events: auto;
    }
    #sync-btn {
      background: #f0f0f0;
      color: #333;
    }
    #sync-btn.on {
      background: #1bc47d;
      color: #fff;
      font-weight: 600;
    }
    #sync-status {
      color: #666;
      min-height: 14px;
      font-size: 11px;
    }
    #sync-status.warn {
      color: #b8860b;
    }
    #sync-status.error {
      color: #c0392b;
    }
    #sync-note {
      color: #999;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="row">
    <button id="export-btn">Export variables + styles</button>
    <button id="copy-btn" disabled>Copy JSON</button>
    <a id="download-link" download="capture-figma-export.json">Download JSON</a>
  </div>
  <div id="status"></div>
  <div class="row">
    <button id="sync-btn">Start sync</button>
    <div id="sync-status">Sync is off. One-shot export above still works with no listener running.</div>
  </div>
  <div id="sync-note">
    Live sync POSTs to a local listener on localhost only (never the internet) and only runs
    while this plugin panel stays open in the file — Figma has no background execution, so
    closing this panel stops sync.
  </div>
  <textarea id="output" readonly placeholder="Export output will appear here..."></textarea>

  <script>
    const exportBtn = document.getElementById("export-btn");
    const copyBtn = document.getElementById("copy-btn");
    const downloadLink = document.getElementById("download-link");
    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const syncBtn = document.getElementById("sync-btn");
    const syncStatus = document.getElementById("sync-status");

    let syncOn = false;

    syncBtn.addEventListener("click", () => {
      if (syncOn) {
        parent.postMessage({ pluginMessage: { type: "stop-sync" } }, "*");
      } else {
        parent.postMessage({ pluginMessage: { type: "start-sync" } }, "*");
      }
    });

    exportBtn.addEventListener("click", () => {
      status.classList.remove("error");
      status.textContent = "Exporting...";
      exportBtn.disabled = true;
      copyBtn.disabled = true;
      downloadLink.classList.remove("enabled");
      output.value = "";
      parent.postMessage({ pluginMessage: { type: "export" } }, "*");
    });

    copyBtn.addEventListener("click", () => {
      output.select();
      document.execCommand("copy");
      status.textContent = "Copied to clipboard.";
    });

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      exportBtn.disabled = false;

      if (msg.type === "export-result") {
        const json = JSON.stringify(msg.data, null, 2);
        output.value = json;
        copyBtn.disabled = false;

        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        downloadLink.href = url;
        downloadLink.classList.add("enabled");

        const counts = msg.data.header && msg.data.header.counts ? msg.data.header.counts : {};
        const variableCountEntries = Object.entries(counts).filter(
          ([key]) => key.indexOf("styles/") !== 0
        );
        const collectionCount = variableCountEntries.length;
        const variableCount = variableCountEntries.reduce((sum, [, n]) => sum + n, 0);

        const styleCounts =
          msg.data.header && msg.data.header.styleCounts ? msg.data.header.styleCounts : null;
        const styleCount = styleCounts ? styleCounts.total : 0;

        status.textContent =
          "Exported " +
          variableCount +
          " variables across " +
          collectionCount +
          " collection(s), " +
          styleCount +
          " styles (text " +
          (styleCounts ? styleCounts.text : 0) +
          ", paint " +
          (styleCounts ? styleCounts.paint : 0) +
          ", effect " +
          (styleCounts ? styleCounts.effect : 0) +
          ", grid " +
          (styleCounts ? styleCounts.grid : 0) +
          ").";
      } else if (msg.type === "export-error") {
        status.classList.add("error");
        status.textContent = "Export failed: " + msg.message;
      } else if (msg.type === "sync-status") {
        syncStatus.classList.remove("warn", "error");

        if (msg.state === "loading") {
          syncStatus.textContent = msg.message || "loading all pages…";
        } else if (msg.state === "on") {
          syncOn = true;
          syncBtn.textContent = "Stop sync";
          syncBtn.classList.add("on");
          syncStatus.textContent = "Sync on — exporting now...";
        } else if (msg.state === "off") {
          syncOn = false;
          syncBtn.textContent = "Start sync";
          syncBtn.classList.remove("on");
          syncStatus.textContent = "Sync is off. One-shot export above still works with no listener running.";
        } else if (msg.state === "synced") {
          const t = new Date(msg.lastSyncAt).toLocaleTimeString();
          syncStatus.textContent =
            "Last sync: " + t + " — " + msg.lastSyncCount + " item(s) sent to listener.";
        } else if (msg.state === "unreachable") {
          syncStatus.classList.add("warn");
          syncStatus.textContent = msg.message + " (will retry on next change).";
        } else if (msg.state === "listener-error") {
          syncStatus.classList.add("warn");
          syncStatus.textContent = msg.message;
        } else if (msg.state === "error") {
          syncStatus.classList.add("error");
          syncStatus.textContent = msg.message;
        }
      }
    };
  </script>
</body>
</html>
