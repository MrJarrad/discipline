<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Capture Figma</title>
  <style>
    body {
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
      height: 100vh;
    }
    button {
      font-family: inherit;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    #export-btn {
      background: #18a0fb;
      color: #fff;
      font-weight: 600;
    }
    #export-btn:disabled {
      background: #a6d8fd;
      cursor: default;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    #status {
      color: #666;
      min-height: 14px;
    }
    #status.error {
      color: #c0392b;
    }
    textarea {
      flex: 1;
      width: 100%;
      box-sizing: border-box;
      font-family: "SFMono-Regular", Consolas, Menlo, monospace;
      font-size: 11px;
      resize: none;
      border: 1px solid #e6e6e6;
      border-radius: 6px;
      padding: 8px;
    }
    #copy-btn, #download-link {
      background: #f0f0f0;
      color: #333;
    }
    #download-link {
      display: inline-block;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      opacity: 0.4;
      pointer-events: none;
    }
    #download-link.enabled {
      opacity: 1;
      pointer-events: auto;
    }
    #sync-btn {
      background: #f0f0f0;
      color: #333;
    }
    #sync-btn.on {
      background: #1bc47d;
      color: #fff;
      font-weight: 600;
    }
    #sync-status {
      color: #666;
      min-height: 14px;
      font-size: 11px;
    }
    #sync-status.warn {
      color: #b8860b;
    }
    #sync-status.error {
      color: #c0392b;
    }
    #sync-note {
      color: #999;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="row">
    <button id="export-btn">Export variables + styles</button>
    <button id="copy-btn" disabled>Copy JSON</button>
    <a id="download-link" download="capture-figma-export.json">Download JSON</a>
  </div>
  <div id="status"></div>
  <div class="row">
    <button id="sync-btn">Start sync</button>
    <div id="sync-status">Sync is off. One-shot export above still works with no listener running.</div>
  </div>
  <div id="sync-note">
    Live sync POSTs to a local listener on localhost only (never the internet) and only runs
    while this plugin panel stays open in the file — Figma has no background execution, so
    closing this panel stops sync.
  </div>
  <textarea id="output" readonly placeholder="Export output will appear here..."></textarea>

  <script>
    // The only context in this plugin with a real fetch() — see code.js's
    // CAPTURE_LISTENER_URL comment: the main-thread sandbox has no browser
    // APIs at all. Must match manifest.json's networkAccess.allowedDomains
    // ("http://localhost:4411") exactly, including the "localhost" hostname
    // (not "127.0.0.1" — Figma's manifest validator only accepts bare
    // hostnames/domains there, so the fetch target has to match verbatim).
    const CAPTURE_LISTENER_URL = "http://localhost:4411/capture";

    const exportBtn = document.getElementById("export-btn");
    const copyBtn = document.getElementById("copy-btn");
    const downloadLink = document.getElementById("download-link");
    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const syncBtn = document.getElementById("sync-btn");
    const syncStatus = document.getElementById("sync-status");

    let syncOn = false;

    syncBtn.addEventListener("click", () => {
      if (syncOn) {
        parent.postMessage({ pluginMessage: { type: "stop-sync" } }, "*");
      } else {
        parent.postMessage({ pluginMessage: { type: "start-sync" } }, "*");
      }
    });

    exportBtn.addEventListener("click", () => {
      status.classList.remove("error");
      status.textContent = "Exporting...";
      exportBtn.disabled = true;
      copyBtn.disabled = true;
      downloadLink.classList.remove("enabled");
      output.value = "";
      parent.postMessage({ pluginMessage: { type: "export" } }, "*");
    });

    copyBtn.addEventListener("click", () => {
      output.select();
      document.execCommand("copy");
      status.textContent = "Copied to clipboard.";
    });

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "sync-post") {
        // Perform the live-sync POST here — code.js's main thread has no
        // fetch (see its CAPTURE_LISTENER_URL comment). Report the result
        // back over the same postMessage channel; never let this throw back
        // into code.js's await — a network failure is reported as
        // { ok: false, error } and handled there as "listener unreachable".
        const payload = JSON.stringify(msg.data);
        // Pre-check content-length before POSTing: the listener rejects
        // bodies over 50MB outright (scripts/capture-listener.mjs), so warn
        // in the UI as the payload approaches/exceeds that limit instead of
        // finding out only after a 413. Byte length via Blob.size (UTF-8
        // aware) rather than payload.length (UTF-16 code units) since the
        // listener measures actual bytes received.
        const payloadBytes = new Blob([payload]).size;
        const LISTENER_MAX_BYTES = 50 * 1024 * 1024;
        const WARN_THRESHOLD_BYTES = LISTENER_MAX_BYTES * 0.9;
        if (payloadBytes > LISTENER_MAX_BYTES) {
          // REFUSE to POST at all — the listener rejects bodies over 50MB
          // outright (scripts/capture-listener.mjs's MAX_BODY_BYTES), so
          // sending anyway just burns a round trip to get the same 413 back.
          // This is the ONE POST code path shared by every trigger (the
          // immediate export on "Start sync" and every debounced
          // document-change resync), so the refusal covers both.
          syncStatus.classList.add("error");
          const mb = (payloadBytes / (1024 * 1024)).toFixed(1);
          syncStatus.textContent = "Payload is " + mb + "MB — over the listener's 50MB limit, refusing to POST.";
          parent.postMessage(
            { pluginMessage: { type: "sync-post-result", ok: false, error: "payload " + mb + "MB exceeds the listener's 50MB limit" } },
            "*"
          );
          return;
        }
        if (payloadBytes >= WARN_THRESHOLD_BYTES) {
          // Shown directly here (no round trip through code.js needed — the
          // payload and the fetch both live in this iframe already); the
          // "synced"/"unreachable"/etc. status from code.js overwrites this
          // once the POST resolves, same as any other sync-status update.
          syncStatus.classList.add("warn");
          const mb = (payloadBytes / (1024 * 1024)).toFixed(1);
          syncStatus.textContent = "Payload is " + mb + "MB — approaching the listener's 50MB limit.";
        }

        fetch(CAPTURE_LISTENER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: payload,
        })
          .then((res) => {
            if (res.ok) {
              parent.postMessage(
                { pluginMessage: { type: "sync-post-result", ok: true, status: res.status } },
                "*"
              );
              return;
            }
            // Failure: surface the listener's own response body (its
            // specific validation message, e.g. "invalid export shape:
            // missing header.fileName") rather than just the status code —
            // that message is what actually tells a human what to fix.
            res
              .text()
              .then((bodyText) => {
                parent.postMessage(
                  {
                    pluginMessage: {
                      type: "sync-post-result",
                      ok: false,
                      status: res.status,
                      body: bodyText,
                    },
                  },
                  "*"
                );
              })
              .catch(() => {
                parent.postMessage(
                  { pluginMessage: { type: "sync-post-result", ok: false, status: res.status } },
                  "*"
                );
              });
          })
          .catch((err) => {
            parent.postMessage(
              {
                pluginMessage: {
                  type: "sync-post-result",
                  ok: false,
                  error: err && err.message ? err.message : String(err),
                },
              },
              "*"
            );
          });
        return;
      }

      if (msg.type === "export-progress") {
        // One-way phase status during buildExport() (collecting variables/
        // styles/components, resolving templates, scanning capabilities,
        // linting) — shown on whichever status line is currently active so
        // it's visible for both a manual export and a sync run. Falls
        // through without touching exportBtn/copyBtn/downloadLink state —
        // this is mid-export, not a completion.
        status.classList.remove("error");
        status.textContent = msg.text;
        if (syncOn) {
          syncStatus.classList.remove("warn", "error");
          syncStatus.textContent = msg.text;
        }
        return;
      }

      exportBtn.disabled = false;

      if (msg.type === "export-result") {
        const json = JSON.stringify(msg.data, null, 2);
        output.value = json;
        copyBtn.disabled = false;

        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        downloadLink.href = url;
        downloadLink.classList.add("enabled");

        const counts = msg.data.header && msg.data.header.counts ? msg.data.header.counts : {};
        const variableCountEntries = Object.entries(counts).filter(
          ([key]) => key.indexOf("styles/") !== 0
        );
        const collectionCount = variableCountEntries.length;
        const variableCount = variableCountEntries.reduce((sum, [, n]) => sum + n, 0);

        const styleCounts =
          msg.data.header && msg.data.header.styleCounts ? msg.data.header.styleCounts : null;
        const styleCount = styleCounts ? styleCounts.total : 0;

        const componentCounts =
          msg.data.header && msg.data.header.componentCounts ? msg.data.header.componentCounts : null;
        const warningCount =
          msg.data.header && typeof msg.data.header.warningCount === "number" ? msg.data.header.warningCount : 0;

        status.textContent =
          "Exported " +
          variableCount +
          " variables across " +
          collectionCount +
          " collection(s), " +
          styleCount +
          " styles (text " +
          (styleCounts ? styleCounts.text : 0) +
          ", paint " +
          (styleCounts ? styleCounts.paint : 0) +
          ", effect " +
          (styleCounts ? styleCounts.effect : 0) +
          ", grid " +
          (styleCounts ? styleCounts.grid : 0) +
          "), " +
          (componentCounts ? componentCounts.standalone + componentCounts.sets : 0) +
          " components" +
          (warningCount > 0 ? ", " + warningCount + " warning(s)" : "") +
          ".";
      } else if (msg.type === "export-error") {
        status.classList.add("error");
        status.textContent = "Export failed: " + msg.message;
      } else if (msg.type === "sync-status") {
        syncStatus.classList.remove("warn", "error");

        if (msg.state === "loading") {
          syncStatus.textContent = msg.message || "loading all pages…";
        } else if (msg.state === "on") {
          syncOn = true;
          syncBtn.textContent = "Stop sync";
          syncBtn.classList.add("on");
          syncStatus.textContent = "Sync on — exporting now...";
        } else if (msg.state === "off") {
          syncOn = false;
          syncBtn.textContent = "Start sync";
          syncBtn.classList.remove("on");
          syncStatus.textContent = "Sync is off. One-shot export above still works with no listener running.";
        } else if (msg.state === "synced") {
          const t = new Date(msg.lastSyncAt).toLocaleTimeString();
          syncStatus.textContent =
            "Last sync: " + t + " — " + msg.lastSyncCount + " item(s) sent to listener.";
        } else if (msg.state === "restored") {
          // From clientStorage, loaded once at panel-open — a prior
          // session's last successful sync, shown before this session has
          // synced anything itself. Overwritten by the next real "synced"
          // (or any other) status the moment this session produces one.
          const t = new Date(msg.lastSyncAt).toLocaleTimeString();
          const d = new Date(msg.lastSyncAt).toLocaleDateString();
          syncStatus.textContent =
            "Last sync: " + t + " on " + d + " — " + msg.lastSyncCount + " item(s) (previous session).";
        } else if (msg.state === "unreachable") {
          syncStatus.classList.add("warn");
          syncStatus.textContent = msg.message + " (will retry on next change).";
        } else if (msg.state === "listener-error") {
          syncStatus.classList.add("warn");
          syncStatus.textContent = msg.message;
        } else if (msg.state === "error") {
          syncStatus.classList.add("error");
          syncStatus.textContent = msg.message;
        }
      }
    };
  </script>
</body>
</html>
