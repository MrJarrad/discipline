<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Capture Figma</title>
  <style>
    /* --- tokens: this file has no host design system to inherit from (a
       self-contained Figma plugin iframe, no bundler/DS import), so this is
       its own small token set — every color/spacing/radius below is a var
       reference, never a bare literal in a rule. Spacing/type values are
       scaled to the plugin's native CSS-px panel (figma.showUI opens at
       342 wide, content-hugging height — see code.js's PANEL_WIDTH/resize
       handling — no devicePixelRatio scaling). The design contract renders
       (~/JHD/vault/artifacts/capture-ui-figma-design/figma-capture-figma*.png,
       684x420 / 682x876) are RETINA (2x) — every measurement taken off them is
       divided by 2 before it becomes a px value here (2026-08-01 pixel audit,
       measured via direct pixel/connected-component analysis of the contract
       PNGs, not eyeballing). Two prior rescale passes (1c285e7, 330b3cc) only
       corrected body text/panel width and left row padding, button padding,
       inter-row gaps, and the count-number/count-label sizes at their
       original retina-derived values — this pass corrects those against
       measured contract pixels (see the capture-figma skill's front-loaded
       retina rule for the failure story). --- */
    :root {
      --color-bg: #ffffff;
      --color-text: #1e1e1e;
      --color-text-secondary: #55565c;
      --color-text-muted: #9a9a9a;
      --color-border: #ececed;
      --color-chip-bg: #f0f0f0;
      --color-chip-border: rgba(0, 0, 0, 0.06);
      --color-chip-count-text: #27272a;
      --color-chip-label-text: #6b7280;
      --color-dot-idle: #9ca3af;
      --color-dot-green: #22c55e;
      --color-dot-purple: #a78bfa;
      --color-dot-amber: #f59e0b;
      --color-dot-red: #ef4444;
      --color-sync-bg: #ecfdf5;
      --color-sync-border: #bbf7d0;
      --color-sync-text: #15803d;
      --color-secondary-bg: #f3f4f6;
      --color-secondary-text: #27272a;
      --color-secondary-border: #e5e7eb;
      --color-snapshot-bg: #f5f3ff;
      --color-snapshot-border: #ddd6fe;
      --color-snapshot-text: #6d28d9;
      --radius-sm: 6px;
      --radius-md: 8px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 10px;
      --space-4: 14px;
      --space-5: 16px;
      --font-sans: Inter, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, Menlo, monospace;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--color-text);
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
    }

    /* Flat, full-bleed rows: the border-bottom sits on the row's outer box
       (outside the padding box), so it spans the panel's full width even
       though the row's own content is inset by --space-5 — no separate
       divider element needed. No card/box border treatment anywhere. */
    .row {
      display: flex;
      flex-direction: column;
      /* gap 4px (space-1), not the prior 10px (space-3) — measured contract
         row height (sync/snapshot rows, 62.5px native each) only fits its
         status-row-top + btn-row content at a ~4px inter-block gap. */
      gap: var(--space-1);
      /* padding 10px/14px (space-3/space-4), not the prior 14px/16px
         (space-4/space-5) — measured from the button-box bottom edge to the
         row's border (9.5px native) and the dot's left edge to the row's
         left border (12px native) in the contract PNGs. */
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-border);
    }

    .status-row-top {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: 2px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      min-width: 8px;
      border-radius: 50%;
      background: var(--color-dot-idle);
    }
    .status-dot.green { background: var(--color-dot-green); }
    .status-dot.purple,
    .status-dot.purple-idle { background: var(--color-dot-purple); }
    .status-dot.amber { background: var(--color-dot-amber); }
    .status-dot.red { background: var(--color-dot-red); }

    /* Quiet by default (idle rows read as one plain muted sentence — see
       "Ready — click POST to sync" / "No snapshot yet" in the mockup).
       A colored, meaningful dot promotes the state word to bold/primary —
       matches "Synced" / "Snapshot saved" in the mockup. "purple-idle" is
       deliberately excluded so the snapshot row's at-rest purple dot (its
       brand color even when nothing has happened yet) doesn't trigger it. */
    .status-state {
      font-weight: 400;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }
    .status-dot.green ~ .status-state,
    .status-dot.amber ~ .status-state,
    .status-dot.red ~ .status-state,
    .status-dot.purple ~ .status-state {
      font-weight: 700;
      color: var(--color-text);
    }
    .status-detail {
      color: var(--color-text-secondary);
      flex: 1;
      min-width: 0;
      overflow-wrap: break-word;
    }
    .status-time {
      color: var(--color-text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .btn-row {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .btn {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      /* 4px/10px (space-1/space-3), not the prior 8px/14px — measured
         button-box height (~21.5px native, border included) and width
         (~42-65px native across Sync/Copy/Download) against each button's
         own text width in the contract PNGs; line-height:1 added since the
         browser-default line-height alone (~14.4px at 12px) plus the old
         padding overshot every measured button height by ~30-50%. */
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-secondary-border);
      background: var(--color-secondary-bg);
      color: var(--color-secondary-text);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: background-color 120ms ease, opacity 120ms ease;
    }
    .btn:disabled,
    .btn[aria-disabled="true"] {
      opacity: 0.45;
      cursor: default;
      pointer-events: none;
    }
    .btn.sync {
      background: var(--color-sync-bg);
      color: var(--color-sync-text);
      border-color: var(--color-sync-border);
    }
    .btn.snapshot {
      background: var(--color-snapshot-bg);
      color: var(--color-snapshot-text);
      border-color: var(--color-snapshot-border);
    }
    /* Hover states: not shown in the design contract (the contract PNGs are
       two static idle/synced-state renders with no hover variant captured) —
       the contract is silent here (flagged in the PR report, not invented as
       a creative treatment). Each variant's hover reuses that SAME button's
       own existing border-color token as its hover background — a plain
       "step one shade toward the border" idiom already present in the
       token set, not a new color. Skipped for disabled/aria-disabled buttons
       (the pointer-events:none rule above already keeps hover from firing on
       them, but the guard is explicit here for clarity). */
    .btn:not(:disabled):not([aria-disabled="true"]):hover {
      background: var(--color-secondary-border);
    }
    .btn.sync:not(:disabled):not([aria-disabled="true"]):hover {
      background: var(--color-sync-border);
    }
    .btn.snapshot:not(:disabled):not([aria-disabled="true"]):hover {
      background: var(--color-snapshot-border);
    }

    /* The sync outcome line ("N item(s) sent to listener — N warning(s)").
       Operator placement (verdict 2026-08-01, Addendum 2 item 2): BELOW the
       sync section's buttons, not inline beside the status word — the
       result is the outcome OF the button, so it reads under it. Spacing
       stays on the row's own rhythm: the .row flex gap (--space-1) plus
       this --space-1 top margin, the same "gap plus a touch" idiom the
       operator's earlier .status-row-top refinement established. Collapses
       entirely when empty so an idle/erroring row keeps its hugging height
       (an empty block would otherwise reserve a line box). */
    .sync-result {
      margin: var(--space-1) 0 0;
      color: var(--color-text-secondary);
      overflow-wrap: break-word;
    }
    .sync-result:empty {
      display: none;
    }

    .count-heading {
      display: flex;
      align-items: baseline;
      gap: var(--space-2);
    }
    .count-number {
      /* 17px, not the prior 24px — the prior value was the retina-render
         digit height read directly (a residual of the incomplete 1c285e7/
         330b3cc rescale), never divided by 2. Measured digit glyph height
         is 24px across all three contract counts (576/79/136) at 2x; ÷2 and
         corrected for Inter's ~0.716 cap-height ratio gives ~17px native. */
      font-size: 17px;
      font-weight: 800;
      line-height: 1;
      color: var(--color-text);
    }
    .count-label {
      /* 9px, not the prior 11px — measured uppercase label glyph height is
         13px at 2x (consistent across VARIABLES/STYLES/COMPONENTS); ÷2 and
         cap-height-corrected gives ~9px native. */
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--color-text-secondary);
    }
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      column-gap: 10px;
      row-gap: var(--space-2);
    }
    .stat-chip {
      font-size: 12px;
      /* 4px/10px (space-1/space-3), not the prior 6px/10px vertical —
         measured chip-box height (~21px native, border included) against
         12px text + default line-height overshot by the prior padding. */
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-sm);
      background: var(--color-chip-bg);
      border: 1px solid var(--color-chip-border);
      color: var(--color-chip-label-text);
    }
    .stat-chip .chip-count {
      font-weight: 600;
      color: var(--color-chip-count-text);
    }

    .raw-json-row {
      padding: var(--space-4) var(--space-5);
    }
    details.raw-json summary {
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-muted);
      list-style: none;
    }
    details.raw-json summary::-webkit-details-marker {
      display: none;
    }
    details.raw-json pre {
      margin: var(--space-2) 0 0;
      max-height: 260px;
      overflow: auto;
      background: var(--color-secondary-bg);
      border-radius: var(--radius-sm);
      padding: var(--space-2);
      font-family: var(--font-mono);
      font-size: 10px;
      white-space: pre;
    }
  </style>
</head>
<body>
  <!-- No in-body title row: in the Figma mockup, the title/puzzle-icon/
       sparkle/close chrome is Figma's native plugin window bar, not iframe
       content — this document begins at the first status row. -->
  <section class="row" id="sync-row" aria-label="Sync status">
    <div class="status-row-top" role="status" aria-live="polite">
      <span class="status-dot" id="sync-dot"></span>
      <span class="status-state" id="sync-state">Ready</span>
      <span class="status-detail" id="sync-detail"></span>
      <span class="status-time" id="sync-time"></span>
    </div>
    <div class="btn-row">
      <button
        type="button"
        class="btn sync"
        id="sync-btn"
        title="Sync runs one export and POSTs it to a local listener on localhost only (never the internet) — a manual, one-shot action, never a background/continuous mode."
      >Sync</button>
      <button type="button" class="btn" id="copy-btn" disabled>Copy</button>
      <a class="btn" id="download-btn" download="capture-figma-export.json" aria-disabled="true">Download</a>
    </div>
    <p class="sync-result" id="sync-result" role="status" aria-live="polite"></p>
  </section>

  <section class="row" id="snapshot-row" aria-label="Snapshot status">
    <div class="status-row-top" role="status" aria-live="polite">
      <span class="status-dot purple-idle" id="snapshot-dot"></span>
      <span class="status-state" id="snapshot-state">No snapshot yet</span>
      <span class="status-detail" id="snapshot-detail"></span>
      <span class="status-time" id="snapshot-time"></span>
    </div>
    <div class="btn-row">
      <button type="button" class="btn snapshot" id="snapshot-btn">Save snapshot</button>
    </div>
  </section>

  <div id="counts"></div>

  <section class="raw-json-row">
    <details class="raw-json" id="raw-json">
      <summary id="raw-json-summary">▶ Raw JSON</summary>
      <pre id="raw-json-output"></pre>
    </details>
  </section>

  <script>
    // The only context in this plugin with a real fetch() — see code.js's
    // CAPTURE_LISTENER_URL comment: the main-thread sandbox has no browser
    // APIs at all. Must match manifest.json's networkAccess.allowedDomains
    // ("http://localhost:4411") exactly, including the "localhost" hostname
    // (not "127.0.0.1" — Figma's manifest validator only accepts bare
    // hostnames/domains there, so the fetch target has to match verbatim).
    const CAPTURE_LISTENER_URL = "http://localhost:4411/capture";
    const LISTENER_MAX_BYTES = 50 * 1024 * 1024;
    const WARN_THRESHOLD_BYTES = LISTENER_MAX_BYTES * 0.9;

    const syncDot = document.getElementById("sync-dot");
    const syncStateEl = document.getElementById("sync-state");
    const syncDetailEl = document.getElementById("sync-detail");
    const syncTimeEl = document.getElementById("sync-time");
    const syncBtn = document.getElementById("sync-btn");
    const copyBtn = document.getElementById("copy-btn");
    const downloadBtn = document.getElementById("download-btn");
    const syncResultEl = document.getElementById("sync-result");

    const snapshotDot = document.getElementById("snapshot-dot");
    const snapshotStateEl = document.getElementById("snapshot-state");
    const snapshotDetailEl = document.getElementById("snapshot-detail");
    const snapshotTimeEl = document.getElementById("snapshot-time");
    const snapshotBtn = document.getElementById("snapshot-btn");

    const countsEl = document.getElementById("counts");
    const rawJsonDetails = document.getElementById("raw-json");
    const rawJsonSummary = document.getElementById("raw-json-summary");
    const rawJsonOutput = document.getElementById("raw-json-output");

    // --- PropsKit feature-detect probe --------------------------------------
    //
    // Whether Figma's fig-* web components (~/JHD/design-tools/shared/
    // figma-props-kit/) are actually registered in THIS plugin iframe is
    // documented there as UNVERIFIED — only a live probe from inside the
    // iframe can answer it; code.js's main-thread sandbox has no DOM at all.
    // Detection: customElements.get("fig-button") returning a real
    // constructor that extends HTMLElement. fig-button is the exact tag the
    // props-kit README itself names for a lookup, and requiring both "get
    // returned something" AND "that something extends HTMLElement" rules out
    // the only realistic false-positive (some unrelated script registering
    // an unrelated, non-element value under the same tag name) — a bare
    // `!!customElements.get(...)` alone would still pass a same-named
    // non-custom-element registration, which this doesn't accept.
    function detectPropskitAvailable() {
      if (typeof customElements === "undefined" || typeof customElements.get !== "function") {
        return false;
      }
      const ctor = customElements.get("fig-button");
      return typeof ctor === "function" && ctor.prototype instanceof HTMLElement;
    }

    parent.postMessage(
      { pluginMessage: { type: "propskit-availability", available: detectPropskitAvailable() } },
      "*"
    );

    let lastExportJson = null;
    // Whether rawJsonOutput.textContent currently reflects lastExportJson —
    // false right after a new export lands, true once renderRawJsonIfNeeded() has
    // actually filled it in (deferred until the <details> panel is opened;
    // see renderRawJsonIfNeeded()).
    let rawJsonRendered = false;
    // Tracks the blob URL currently on downloadBtn.href, so it can be
    // revoked before the next one replaces it — createObjectURL()'s
    // reference otherwise stays alive for the panel's whole lifetime, and
    // each Sync click can produce a new export.
    let currentDownloadUrl = null;

    // The Figma-mockup window hugs its content (no reserved empty space) —
    // code.js opens figma.showUI at an idle-height guess and relies on this
    // to report the real measured height back for the corrective boot
    // resize, then again on every later state transition (sync/snapshot row
    // changes, count sections rendering, Raw JSON expand/collapse). rAF-
    // batched so several synchronous DOM writes in one state transition
    // (e.g. setSyncRow + renderCounts on "restored") collapse into a single
    // postMessage instead of one per write — never on a per-repaint/polling
    // basis. code.js clamps and applies the actual figma.ui.resize() call;
    // this side only ever reports.
    let resizeScheduled = false;
    function scheduleResize() {
      if (resizeScheduled) return;
      resizeScheduled = true;
      requestAnimationFrame(() => {
        resizeScheduled = false;
        parent.postMessage(
          { pluginMessage: { type: "resize", height: document.body.scrollHeight } },
          "*"
        );
      });
    }
    // Boot-time correction: code.js opens figma.showUI with an idle-height
    // guess (it can't measure the DOM before the iframe exists) — this
    // reports the real rendered idle height the moment the DOM is parsed.
    scheduleResize();

    function setSyncRow(dotClass, state, detail, time) {
      syncDot.className = "status-dot" + (dotClass ? " " + dotClass : "");
      syncStateEl.textContent = state;
      syncDetailEl.textContent = detail || "";
      syncTimeEl.textContent = time || "";
      scheduleResize();
    }

    // The below-the-buttons sync outcome line (see .sync-result's CSS
    // comment). Separate from setSyncRow's `detail` slot, which stays for
    // in-flight/erroring text that belongs beside the state word.
    function setSyncResult(text) {
      syncResultEl.textContent = text || "";
      scheduleResize();
    }

    function setSnapshotRow(dotClass, state, detail, time) {
      snapshotDot.className = "status-dot" + (dotClass ? " " + dotClass : "");
      snapshotStateEl.textContent = state;
      snapshotDetailEl.textContent = detail || "";
      snapshotTimeEl.textContent = time || "";
      scheduleResize();
    }

    // --- sync row --------------------------------------------------------

    syncBtn.addEventListener("click", () => {
      parent.postMessage({ pluginMessage: { type: "sync" } }, "*");
    });

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }

    copyBtn.addEventListener("click", () => {
      if (!lastExportJson) return;
      // navigator.clipboard is the modern API, but it can reject inside a
      // plugin iframe without a "clipboard-write" permissions policy — fall
      // back to the older selection-based execCommand("copy") either when
      // the API isn't present at all, or when it's present but rejects.
      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        navigator.clipboard.writeText(lastExportJson).catch(() => fallbackCopy(lastExportJson));
        return;
      }
      fallbackCopy(lastExportJson);
    });

    function enableCopyDownload(data) {
      // The only place the full export payload gets stringified, anywhere in
      // this file — renderRawJsonIfNeeded() below reuses lastExportJson
      // instead of re-serializing the same data a second time (lag
      // diagnosis finding 3: this used to run twice, synchronously, on
      // every Sync even with the Raw JSON panel collapsed).
      lastExportJson = JSON.stringify(data, null, 2);
      // A new export invalidates whatever the Raw JSON panel is currently
      // showing (even collapsed) — it's re-rendered lazily, either right
      // below if the panel is already open, or on the next time it's opened.
      rawJsonRendered = false;
      copyBtn.disabled = false;

      const blob = new Blob([lastExportJson], { type: "application/json" });
      if (currentDownloadUrl) {
        URL.revokeObjectURL(currentDownloadUrl);
      }
      currentDownloadUrl = URL.createObjectURL(blob);
      downloadBtn.href = currentDownloadUrl;
      downloadBtn.setAttribute("aria-disabled", "false");
    }

    // --- count sections ----------------------------------------------------

    function statChip(label, count) {
      const el = document.createElement("span");
      el.className = "stat-chip";
      const countEl = document.createElement("span");
      countEl.className = "chip-count";
      countEl.textContent = count.toLocaleString();
      el.appendChild(countEl);
      el.appendChild(document.createTextNode(" " + label));
      return el;
    }

    function slug(name) {
      return name.trim().toLowerCase().replace(/\s+/g, "-");
    }

    function countSection(total, label, entries) {
      const section = document.createElement("div");
      section.className = "row count-section";

      const heading = document.createElement("div");
      heading.className = "count-heading";
      const num = document.createElement("span");
      num.className = "count-number";
      num.textContent = total.toLocaleString();
      const lab = document.createElement("span");
      lab.className = "count-label";
      lab.textContent = label;
      heading.appendChild(num);
      heading.appendChild(lab);
      section.appendChild(heading);

      if (entries.length) {
        const row = document.createElement("div");
        row.className = "chip-row";
        for (const [chipLabel, count] of entries) {
          row.appendChild(statChip(chipLabel, count));
        }
        section.appendChild(row);
      }

      return section;
    }

    function renderCounts(data) {
      countsEl.innerHTML = "";
      const header = data.header || {};
      const counts = header.counts || {};

      // Variables: every counts[] entry not prefixed "styles/" (those are
      // style-type counts, folded into the STYLES section below), one chip
      // per collection, descending by count.
      const varEntries = Object.entries(counts)
        .filter(([key]) => key.indexOf("styles/") !== 0)
        .sort((a, b) => b[1] - a[1]);
      const varTotal = varEntries.reduce((sum, [, n]) => sum + n, 0);
      countsEl.appendChild(
        countSection(varTotal, "VARIABLES", varEntries.map(([name, n]) => [slug(name), n]))
      );

      // Styles: fixed type order (matches header.styleCounts' own shape),
      // not desc-sorted — "text/paint/effect/grid" is a meaningful taxonomy
      // order, not a ranked list.
      const styleCounts = header.styleCounts || {};
      const styleEntries = ["text", "paint", "effect", "grid"].map((t) => [t, styleCounts[t] || 0]);
      const styleTotal =
        typeof styleCounts.total === "number"
          ? styleCounts.total
          : styleEntries.reduce((sum, [, n]) => sum + n, 0);
      countsEl.appendChild(countSection(styleTotal, "STYLES", styleEntries));

      // Components: standalone + sets.
      const componentCounts = header.componentCounts || { standalone: 0, sets: 0 };
      const componentTotal = (componentCounts.standalone || 0) + (componentCounts.sets || 0);
      countsEl.appendChild(
        countSection(componentTotal, "COMPONENTS", [
          ["standalone", componentCounts.standalone || 0],
          ["sets", componentCounts.sets || 0],
        ])
      );

      // Warnings: grouped by type, descending by count — the count section
      // this UI adds beyond what the plugin already tracked in
      // header.warningCount. Two shapes feed this: a live export-result's
      // raw warnings[] array (grouped here), or a restored-from-clientStorage
      // payload's already-grouped warningsByType map — the raw array isn't
      // persisted (see code.js's LAST_SYNC_STORAGE_KEY comment), so a
      // restore has no warnings[] to regroup, only the counts.
      //
      // The operator's Figma mockup predates this lane (it has no warnings
      // section at all) — kept here, in the same VARIABLES/STYLES/COMPONENTS
      // visual language, as a stated assumption rather than a silent
      // invention; flagged for the operator to veto.
      let byType;
      let warningsTotal;
      if (Array.isArray(data.warnings)) {
        byType = new Map();
        for (const w of data.warnings) {
          const key = w && w.type ? w.type : "unknown";
          byType.set(key, (byType.get(key) || 0) + 1);
        }
        warningsTotal = data.warnings.length;
      } else {
        byType = new Map(Object.entries(data.warningsByType || {}));
        warningsTotal = typeof data.warningCount === "number" ? data.warningCount : 0;
      }
      const warningEntries = Array.from(byType.entries()).sort((a, b) => b[1] - a[1]);
      countsEl.appendChild(
        countSection(
          warningsTotal,
          "WARNINGS",
          warningEntries.map(([type, n]) => [type.replace(/_/g, "-"), n])
        )
      );
      scheduleResize();
    }

    // Lazy: fills the Raw JSON <pre> from lastExportJson (already computed by
    // enableCopyDownload — never re-stringifies) but only does the DOM write
    // when the panel is actually open, and only once per export. Called both
    // right after a Sync (if the panel is already open) and on toggle-open.
    function renderRawJsonIfNeeded() {
      if (rawJsonRendered || !lastExportJson) return;
      rawJsonOutput.textContent = lastExportJson;
      rawJsonRendered = true;
    }

    rawJsonDetails.addEventListener("toggle", () => {
      rawJsonSummary.textContent = (rawJsonDetails.open ? "▼" : "▶") + " Raw JSON";
      if (rawJsonDetails.open) renderRawJsonIfNeeded();
      scheduleResize();
    });

    // --- snapshot row ------------------------------------------------------

    snapshotBtn.addEventListener("click", () => {
      snapshotBtn.disabled = true;
      setSnapshotRow("purple-idle", "Saving snapshot…", "", "");
      parent.postMessage({ pluginMessage: { type: "save-snapshot" } }, "*");
    });

    function handleSnapshotStatus(msg) {
      if (msg.state === "unavailable") {
        snapshotBtn.disabled = true;
        setSnapshotRow("", "Snapshot unavailable", msg.message, "");
      } else if (msg.state === "ready") {
        snapshotBtn.disabled = false;
        // "purple-idle" (not the plain "purple" that promotes the state word
        // to bold): the snapshot dot stays purple even at rest — its brand
        // color, not a "something happened" signal — matching "No snapshot
        // yet" rendering as a single quiet line in the mockup, the same
        // typographic weight as the sync row's idle "Ready" line.
        setSnapshotRow("purple-idle", "No snapshot yet", "", "");
      } else if (msg.state === "saved") {
        snapshotBtn.disabled = false;
        const t = new Date(msg.at).toLocaleTimeString();
        setSnapshotRow("purple", "Snapshot saved", msg.title, t);
      } else if (msg.state === "error") {
        snapshotBtn.disabled = false;
        setSnapshotRow("red", "Snapshot failed", msg.message, "");
      }
    }

    // --- sync-status / export-progress / export-result --------------------

    // Shared by the live "synced" state and the boot-time "restored" state
    // (a prior session's last sync, read back from clientStorage) — both
    // show the same diff-summary sentence, so the string only lives once.
    // `summary` mirrors the listener's changes.jsonl cross-bucket summary
    // (scripts/capture-listener.mjs) — absent on the very first sync of a
    // file (nothing to diff against yet) and on an unchanged/no-op sync.
    // `warningCount` is informational text only, never a status color: a
    // full export routinely carries hundreds of structural-lint warnings
    // (malformed-spacer-name, etc.) that are pre-existing document state,
    // not a sign this sync itself failed or degraded — the dot stays green.
    function buildSyncedDetail(lastSyncCount, summary, warningCount) {
      let detail = lastSyncCount + " item(s) sent to listener";
      if (summary) {
        const parts = [];
        if (summary.added) parts.push(summary.added + " added");
        if (summary.modified) parts.push(summary.modified + " modified");
        if (summary.removed) parts.push(summary.removed + " removed");
        if (summary.renamed) parts.push(summary.renamed + " renamed");
        if (summary.repointed) parts.push(summary.repointed + " repointed");
        if (summary.layerBindings) parts.push(summary.layerBindings + " layer binding(s)");
        if (parts.length) detail = parts.join(", ");
      }
      if (warningCount > 0) {
        detail += " — " + warningCount + " warning(s)";
      }
      return detail;
    }

    // Manual-only sync (vault ruling, token-rulings.md "Sync is MANUAL-ONLY
    // — auto sync removed"): the button always reads "Sync" and always sends
    // the same one-shot message — no toggle state, no "Stop". The row walks
    // Ready -> Syncing -> a terminal state (Synced, or an error/unreachable
    // status) every click; the button is disabled only for that in-flight
    // window so a second click can't overlap the export/POST in progress.
    function handleSyncStatus(msg) {
      if (msg.state === "syncing") {
        syncBtn.disabled = true;
        // The previous run's outcome is stale the moment a new one starts.
        setSyncResult("");
        setSyncRow("", "Syncing…", "exporting now…", "");
      } else if (msg.state === "synced") {
        syncBtn.disabled = false;
        const t = new Date(msg.lastSyncAt).toLocaleTimeString();
        // State word is just "Synced" (bold) — the mockup's regular-weight
        // "to listener" is a static mockup label; the real, richer sync
        // detail (item counts / added-modified-removed) takes that same
        // regular-weight slot instead of being dropped, per BEHAVIOR IS
        // FROZEN (this data must keep showing somewhere) — that slot is now
        // the below-the-buttons result line, per the operator's placement.
        // msg.versionNote is present only when the pre-sync version-history
        // save failed or wasn't available (code.js's savePreSyncVersion) —
        // the sync itself still succeeded, so the dot stays green and the
        // note rides in the detail slot beside "Synced" rather than
        // masquerading as a sync failure.
        setSyncRow("green", "Synced", msg.versionNote || "", t);
        setSyncResult(buildSyncedDetail(msg.lastSyncCount, msg.summary, msg.warningCount));
      } else if (msg.state === "restored") {
        // From clientStorage, loaded once at panel-open — a prior session's
        // last successful sync, shown before this session has synced
        // anything itself. Overwritten by the next real "synced" (or any
        // other) status the moment this session produces one.
        const t = new Date(msg.lastSyncAt).toLocaleTimeString();
        const d = new Date(msg.lastSyncAt).toLocaleDateString();
        setSyncRow("green", "Synced", "", t);
        setSyncResult(msg.lastSyncCount + " item(s) — previous session, " + d);
        // Repaint the count sections too (Variables/Styles/Components/
        // Warnings) — not just the sync row — so a reload shows the full
        // last-sync state, matching state-05-synced.png. Raw JSON/Copy/
        // Download stay empty: the full export payload isn't persisted (see
        // code.js's LAST_SYNC_STORAGE_KEY comment), only this summary.
        renderCounts({ header: msg.header, warningsByType: msg.warningsByType, warningCount: msg.warningCount });
      } else if (msg.state === "unreachable") {
        syncBtn.disabled = false;
        setSyncRow("amber", "Listener unreachable", msg.message + " — click Sync to retry", "");
      } else if (msg.state === "listener-error") {
        syncBtn.disabled = false;
        setSyncRow("amber", "Listener error", msg.message, "");
      } else if (msg.state === "error") {
        syncBtn.disabled = false;
        setSyncRow("red", "Sync error", msg.message, "");
      }
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "sync-post") {
        // Perform the live-sync POST here — code.js's main thread has no
        // fetch (see its CAPTURE_LISTENER_URL comment). Report the result
        // back over the same postMessage channel; never let this throw back
        // into code.js's await — a network failure is reported as
        // { ok: false, error } and handled there as "listener unreachable".
        const payload = JSON.stringify(msg.data);
        // Pre-check content-length before POSTing: the listener rejects
        // bodies over 50MB outright (scripts/capture-listener.mjs), so warn
        // in the UI as the payload approaches/exceeds that limit instead of
        // finding out only after a 413. Byte length via Blob.size (UTF-8
        // aware) rather than payload.length (UTF-16 code units) since the
        // listener measures actual bytes received.
        const payloadBytes = new Blob([payload]).size;
        if (payloadBytes > LISTENER_MAX_BYTES) {
          // REFUSE to POST at all — sending anyway just burns a round trip
          // to get the same 413 back. This is the ONE POST code path every
          // Sync click runs through, so the refusal covers it every time.
          const mb = (payloadBytes / (1024 * 1024)).toFixed(1);
          setSyncRow("red", "Payload too large", mb + "MB — over the listener's 50MB limit, refusing to POST", "");
          parent.postMessage(
            { pluginMessage: { type: "sync-post-result", ok: false, error: "payload " + mb + "MB exceeds the listener's 50MB limit" } },
            "*"
          );
          return;
        }
        if (payloadBytes >= WARN_THRESHOLD_BYTES) {
          // Shown directly here (no round trip through code.js needed — the
          // payload and the fetch both live in this iframe already); the
          // "synced"/"unreachable"/etc. status from code.js overwrites this
          // once the POST resolves, same as any other sync-status update.
          const mb = (payloadBytes / (1024 * 1024)).toFixed(1);
          setSyncRow("amber", "Payload large", mb + "MB — approaching the listener's 50MB limit", "");
        }

        fetch(CAPTURE_LISTENER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: payload,
        })
          .then((res) => {
            if (res.ok) {
              // Parse the listener's response body for warningCount/summary
              // (scripts/capture-listener.mjs's POST /capture contract) so
              // the "synced" status can show them without a separate GET
              // /changes round trip. A body that fails to parse still
              // reports the successful POST — just without those extras.
              res
                .json()
                .then((body) => {
                  parent.postMessage(
                    {
                      pluginMessage: {
                        type: "sync-post-result",
                        ok: true,
                        status: res.status,
                        warningCount: body && typeof body.warningCount === "number" ? body.warningCount : 0,
                        summary: body && body.summary ? body.summary : null,
                      },
                    },
                    "*"
                  );
                })
                .catch(() => {
                  parent.postMessage(
                    { pluginMessage: { type: "sync-post-result", ok: true, status: res.status } },
                    "*"
                  );
                });
              return;
            }
            // Failure: surface the listener's own response body (its
            // specific validation message, e.g. "invalid export shape:
            // missing header.fileName") rather than just the status code —
            // that message is what actually tells a human what to fix.
            res
              .text()
              .then((bodyText) => {
                parent.postMessage(
                  {
                    pluginMessage: {
                      type: "sync-post-result",
                      ok: false,
                      status: res.status,
                      body: bodyText,
                    },
                  },
                  "*"
                );
              })
              .catch(() => {
                parent.postMessage(
                  { pluginMessage: { type: "sync-post-result", ok: false, status: res.status } },
                  "*"
                );
              });
          })
          .catch((err) => {
            parent.postMessage(
              {
                pluginMessage: {
                  type: "sync-post-result",
                  ok: false,
                  error: err && err.message ? err.message : String(err),
                },
              },
              "*"
            );
          });
        return;
      }

      if (msg.type === "export-progress") {
        // One-way phase status during buildExport() (collecting variables/
        // styles/components, resolving templates, scanning capabilities,
        // linting) — shown in the sync row's detail text for every Sync
        // click's export.
        setSyncRow("", "Exporting…", msg.text, "");
        return;
      }

      if (msg.type === "export-result") {
        renderCounts(msg.data);
        enableCopyDownload(msg.data);
        // If the Raw JSON panel is already open from a previous sync, refresh
        // it now — otherwise leave it deferred until the operator opens it.
        if (rawJsonDetails.open) renderRawJsonIfNeeded();
        return;
      }

      if (msg.type === "export-error") {
        setSyncRow("red", "Export failed", msg.message, "");
        return;
      }

      if (msg.type === "sync-status") {
        handleSyncStatus(msg);
        return;
      }

      if (msg.type === "snapshot-status") {
        handleSnapshotStatus(msg);
        return;
      }
    };
  </script>
</body>
</html>
